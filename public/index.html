      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will

      Learn how to configure a non-root public URL by running `npm run build`.

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "BlocksIndia",
        "alternateName": "FreakApps Studio",
        "url": "https://blocksindia.com/",
        "description": "Blockchain validator and development company based in Bangalore, India. Operates enterprise-grade block-producing nodes (protonind) across XPR Network, Metal, Telos, Libre, FIO Protocol, and TRON, and builds blockchain infrastructure, dApps, and AI x blockchain tooling.",

        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Bangalore",
          "addressRegion": "Karnataka",
          "addressCountry": "IN"
        },
        "sameAs": [
          "https://www.facebook.com/ENLIGHTENEERING/",
          "https://www.linkedin.com/company/enlighteneering-inc-"
        ],
        "makesOffer": [
          {
            "@type": "Offer",
            "itemOffered": { "@type": "Service", "name": "Blockchain Development" }
          },
          {
            "@type": "Offer",
            "itemOffered": { "@type": "Service", "name": "dApps Development" }
          },
          {
            "@type": "Offer",
            "itemOffered": { "@type": "Service", "name": "Node Validator Services" }
          },
          {
            "@type": "Offer",
            "itemOffered": { "@type": "Service", "name": "Blockchain Consultation" }
          }
